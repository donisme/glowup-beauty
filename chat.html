<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlowUp — Chat Cộng Đồng</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--rose:#F2A7B4;--rose-deep:#C96B80;--cream:#FDF6EE;--sand:#E8DDD0;--espresso:#3B2A2A;--taupe:#8A7567}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--espresso);height:100vh;display:flex;flex-direction:column}
nav{background:var(--cream);border-bottom:1px solid var(--sand);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--espresso);text-decoration:none}
.logo span{color:var(--rose-deep);font-style:italic}
.nav-r{display:flex;align-items:center;gap:1rem;font-size:.85rem}
.nav-r a{color:var(--taupe);text-decoration:none}
.nav-r a:hover{color:var(--rose-deep)}
.chat-wrap{flex:1;display:flex;flex-direction:column;max-width:760px;width:100%;margin:0 auto;padding:1.5rem;gap:1rem;min-height:0}
.chat-header{background:white;border-radius:16px;padding:1.25rem 1.5rem;border:1px solid var(--sand);display:flex;align-items:center;gap:1rem}
.chat-header-icon{font-size:1.5rem}
.chat-header-title{font-family:'Playfair Display',serif;font-size:1.1rem}
.chat-header-sub{font-size:.8rem;color:var(--taupe)}
.online-dot{width:8px;height:8px;background:#4CAF50;border-radius:50%;margin-left:auto;flex-shrink:0}
.messages{flex:1;background:white;border-radius:16px;border:1px solid var(--sand);padding:1.25rem;overflow-y:auto;display:flex;flex-direction:column;gap:.75rem;min-height:0}
.msg-row{display:flex;gap:.4rem;align-items:flex-end}
.msg-row.own{flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose-deep));display:flex;align-items:center;justify-content:center;font-size:.85rem;color:white;font-family:'Playfair Display',serif;flex-shrink:0}
.bubble{display:inline-block;max-width:100%;background:var(--cream);border-radius:16px 16px 16px 4px;padding:.6rem .9rem;font-size:.875rem;line-height:1.5;border:1px solid var(--sand);word-break:break-word;overflow-wrap:anywhere}
.msg-row.own .bubble{background:var(--espresso);color:white;border-radius:16px 16px 4px 16px;border-color:var(--espresso)}
.msg-meta{font-size:.7rem;color:var(--taupe);margin-bottom:.2rem}
.msg-row.own .msg-meta{text-align:right}
.input-wrap{background:white;border-radius:16px;border:1px solid var(--sand);padding:.6rem .75rem;display:flex;gap:.75rem;align-items:center}
.input-wrap textarea{flex:1;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:.9rem;color:var(--espresso);resize:none;height:38px;line-height:38px;background:transparent;padding:0;overflow:hidden}
.input-wrap textarea::placeholder{color:#C4B5AA}
.send-btn{background:var(--espresso);color:white;border:none;border-radius:12px;padding:.6rem 1.25rem;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer;transition:background .2s;white-space:nowrap;flex-shrink:0}
.send-btn:hover{background:var(--rose-deep)}
.send-btn:disabled{background:var(--sand);cursor:not-allowed}
.not-logged{text-align:center;padding:3rem 2rem;background:white;border-radius:16px;border:1px solid var(--sand)}
.not-logged .icon{font-size:3rem;margin-bottom:1rem}
.not-logged h2{font-family:'Playfair Display',serif;margin-bottom:.5rem}
.not-logged p{color:var(--taupe);font-size:.9rem;margin-bottom:1.5rem}
.login-btn{display:inline-block;padding:.75rem 2rem;background:var(--espresso);color:white;border-radius:999px;text-decoration:none;font-weight:500;transition:background .2s}
.login-btn:hover{background:var(--rose-deep)}
.system-msg{text-align:center;font-size:.75rem;color:var(--taupe);padding:.25rem 0}
.loading{text-align:center;color:var(--taupe);font-size:.875rem;padding:2rem}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Glow<span>Up</span></a>
  <div class="nav-r">
    <span id="nav-user"></span>
    <a href="index.html">Trang chủ</a>
    <a href="auth.html">Tài khoản</a>
  </div>
</nav>

<div class="chat-wrap">
  <div class="chat-header">
    <div class="chat-header-icon">💬</div>
    <div>
      <div class="chat-header-title">Chat cộng đồng GlowUp</div>
      <div class="chat-header-sub">Chia sẻ tips làm đẹp, hỏi đáp về mỹ phẩm</div>
    </div>
    <div class="online-dot" title="Online"></div>
  </div>

  <div id="main-area" style="flex:1;display:flex;flex-direction:column;gap:1rem;min-height:0">
    <div class="messages loading">⏳ Đang tải...</div>
  </div>
</div>

<script>
const db = window.supabase.createClient(
  'https://mojgtzjmscmztswhzwzv.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vamd0emptc2NtenRzd2h6d3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NDU5NTksImV4cCI6MjA5NDMyMTk1OX0.DPqyxvdCOyGoqwgwkkF6oRX0YngUJvlYiXVm8zWEaf0'
);

let currentUser = null;
let currentProfile = null;
let profileCache = {};

window.addEventListener('load', async () => {
  const { data:{ user } } = await db.auth.getUser();
  const area = document.getElementById('main-area');

  if (!user) {
    area.innerHTML = `<div class="not-logged">
      <div class="icon">🔒</div>
      <h2>Bạn chưa đăng nhập</h2>
      <p>Đăng nhập để tham gia chat cùng cộng đồng!</p>
      <a href="auth.html" class="login-btn">Đăng nhập ngay</a>
    </div>`;
    return;
  }

  currentUser = user;
  const { data: p } = await db.from('profiles').select('username,role').eq('id', user.id).single();
  currentProfile = p;
  if (p) {
    document.getElementById('nav-user').textContent = '👤 ' + p.username;
    profileCache[user.id] = p.username;
  }

  area.innerHTML = `
    <div class="messages" id="messages"><div class="loading">⏳ Đang tải tin nhắn...</div></div>
    <div class="input-wrap">
      <textarea id="msg-input" placeholder="Nhập tin nhắn... (Enter để gửi)" rows="1" onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="send-btn" onclick="send()">Gửi ✦</button>
    </div>`;

  await loadMessages();
  subscribeRealtime();
});

async function getUsername(userId) {
  if (profileCache[userId]) return profileCache[userId];
  const { data } = await db.from('profiles').select('username').eq('id', userId).single();
  profileCache[userId] = data?.username || 'Ẩn danh';
  return profileCache[userId];
}

async function loadMessages() {
  const { data: msgs } = await db.from('messages').select('*').order('created_at', {ascending:true}).limit(100);
  const box = document.getElementById('messages');
  if (!msgs || msgs.length === 0) {
    box.innerHTML = '<div class="system-msg">Chưa có tin nhắn nào. Hãy bắt đầu cuộc trò chuyện! 🌸</div>';
    return;
  }
  const userIds = [...new Set(msgs.map(m => m.user_id))];
  const { data: profiles } = await db.from('profiles').select('id,username').in('id', userIds);
  profiles?.forEach(p => profileCache[p.id] = p.username);
  box.innerHTML = msgs.map(m => renderMsg(m)).join('');
  box.scrollTop = box.scrollHeight;
}

function renderMsg(m) {
  const isOwn = m.user_id === currentUser?.id;
  const uname = profileCache[m.user_id] || '?';
  const time  = new Date(m.created_at).toLocaleTimeString('vi-VN', {hour:'2-digit',minute:'2-digit'});
  return `<div class="msg-row ${isOwn?'own':''}">
    <div class="av">${uname.charAt(0).toUpperCase()}</div>
    <div style="max-width:calc(100% - 48px);min-width:0">
      <div class="msg-meta">${isOwn ? time : uname + ' · ' + time}</div>
      <div class="bubble">${escHtml(m.content)}</div>
    </div>
  </div>`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function subscribeRealtime() {
  db.channel('messages').on('postgres_changes', {event:'INSERT',schema:'public',table:'messages'}, async payload => {
    const m = payload.new;
    if (!profileCache[m.user_id]) await getUsername(m.user_id);
    const box = document.getElementById('messages');
    if (!box) return;
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    box.insertAdjacentHTML('beforeend', renderMsg(m));
    if (atBottom) box.scrollTop = box.scrollHeight;
  }).subscribe();
}

async function send() {
  const input = document.getElementById('msg-input');
  const content = input.value.trim();
  if (!content || !currentUser) return;
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  input.value = '';
  await db.from('messages').insert({ user_id: currentUser.id, content });
  btn.disabled = false;
  input.focus();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}
</script>
</body>
</html>
