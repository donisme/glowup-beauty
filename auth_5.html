<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlowUp — Đăng nhập</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --rose: #F2A7B4;
    --rose-deep: #C96B80;
    --cream: #FDF6EE;
    --sand: #E8DDD0;
    --espresso: #3B2A2A;
    --taupe: #8A7567;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--espresso);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .container { width: 100%; max-width: 420px; }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    text-align: center;
    margin-bottom: 0.25rem;
    color: var(--espresso);
  }
  .logo span { color: var(--rose-deep); font-style: italic; }

  .tagline { text-align: center; font-size: 0.85rem; color: var(--taupe); margin-bottom: 2rem; }

  .card {
    background: white;
    border-radius: 20px;
    padding: 2rem;
    border: 1px solid var(--sand);
    box-shadow: 0 4px 24px rgba(59,42,42,0.06);
    animation: fadeIn 0.3s ease;
  }

  .tabs {
    display: flex;
    background: var(--cream);
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 1.75rem;
  }

  .tab {
    flex: 1;
    padding: 0.5rem;
    border: none;
    background: transparent;
    border-radius: 999px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--taupe);
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab.active {
    background: white;
    color: var(--espresso);
    box-shadow: 0 2px 8px rgba(59,42,42,0.08);
  }

  .form-group { margin-bottom: 1rem; }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--taupe);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.4rem;
  }

  input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1.5px solid var(--sand);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--espresso);
    background: white;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: var(--rose-deep); }
  input::placeholder { color: #C4B5AA; }

  .btn-primary {
    width: 100%;
    padding: 0.85rem;
    background: var(--espresso);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    margin-top: 0.5rem;
  }

  .btn-primary:hover { background: var(--rose-deep); transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--sand); color: var(--taupe); cursor: not-allowed; transform: none; }

  .message {
    padding: 0.75rem 1rem;
    border-radius: 10px;
    font-size: 0.85rem;
    margin-bottom: 1rem;
    display: none;
  }
  .message.success { background: #E8F5E9; color: #2E7D32; border: 1px solid #A5D6A7; display: block; }
  .message.error   { background: #FFEBEE; color: #C62828; border: 1px solid #FFCDD2; display: block; }

  .logged-in { display: none; text-align: center; }

  .user-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    margin: 0 auto 1rem;
    color: white;
    font-family: 'Playfair Display', serif;
  }

  .user-name { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 0.5rem; }

  .user-role {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    margin-bottom: 1.5rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .user-role.admin { background: #FFF3E0; color: #E65100; border: 1px solid #FFCC80; }
  .user-role.user  { background: #F3E5F5; color: #6A1B9A; border: 1px solid #CE93D8; }

  .action-buttons { display: flex; flex-direction: column; gap: 0.75rem; }

  .btn-action {
    padding: 0.75rem 1rem;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    text-decoration: none;
    display: block;
  }
  .btn-action.primary   { background: var(--espresso); color: white; border: none; }
  .btn-action.primary:hover { background: var(--rose-deep); }
  .btn-action.secondary { background: white; color: var(--espresso); border: 1.5px solid var(--sand); }
  .btn-action.secondary:hover { border-color: var(--rose-deep); color: var(--rose-deep); }
  .btn-action.danger    { background: white; color: #C62828; border: 1.5px solid #FFCDD2; }
  .btn-action.danger:hover { background: #FFEBEE; }

  .back-link { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--taupe); }
  .back-link a { color: var(--rose-deep); text-decoration: none; font-weight: 500; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo">Glow<span>Up</span></div>
  <div class="tagline">Review mỹ phẩm trung thực từ cộng đồng</div>

  <div class="card">

    <div id="auth-form">
      <div class="tabs">
        <button class="tab active" id="tab-login"    onclick="switchTab('login')">Đăng nhập</button>
        <button class="tab"        id="tab-register" onclick="switchTab('register')">Đăng ký</button>
      </div>

      <div id="msg" class="message"></div>

      <div class="form-group" id="username-group" style="display:none">
        <label>Tên hiển thị</label>
        <input type="text" id="username" placeholder="Tên của bạn (vd: Minh Thư)">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="email@example.com">
      </div>

      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="password" placeholder="Ít nhất 6 ký tự">
      </div>

      <button class="btn-primary" id="auth-btn" onclick="handleAuth()">Đăng nhập</button>
    </div>

    <div id="logged-in" class="logged-in">
      <div class="user-avatar"    id="user-avatar">👤</div>
      <div class="user-name"      id="user-name">Xin chào!</div>
      <div class="user-role user" id="user-role">✦ Thành viên</div>

      <div class="action-buttons">
        <a href="index.html"       class="btn-action primary">🏠 Về trang chủ</a>
        <a href="admin.html"       class="btn-action secondary" id="admin-btn" style="display:none">⚙️ Trang quản trị Admin</a>
        <a href="post-review.html" class="btn-action secondary">✍️ Viết review mới</a>
        <button class="btn-action danger" onclick="handleLogout()">Đăng xuất</button>
      </div>
    </div>

  </div>

  <div class="back-link"><a href="index.html">← Quay lại trang chủ</a></div>
</div>

<script>
  const db = window.supabase.createClient(
    'https://mojgtzjmscmztswhzwzv.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vamd0emptc2NtenRzd2h6d3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NDU5NTksImV4cCI6MjA5NDMyMTk1OX0.DPqyxvdCOyGoqwgwkkF6oRX0YngUJvlYiXVm8zWEaf0'
  );

  let currentTab = 'login';

  window.addEventListener('load', async () => {
    const { data: { user } } = await db.auth.getUser();
    if (user) await showLoggedIn(user);
  });

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('username-group').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('auth-btn').textContent = tab === 'login' ? 'Đăng nhập' : 'Đăng ký';
    clearMsg();
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'message ' + type;
  }

  function clearMsg() {
    const el = document.getElementById('msg');
    el.className = 'message';
    el.textContent = '';
  }

  async function handleAuth() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const username = document.getElementById('username').value.trim();
    const btn      = document.getElementById('auth-btn');

    if (!email || !password) return showMsg('Vui lòng điền đầy đủ email và mật khẩu.', 'error');
    if (currentTab === 'register' && !username) return showMsg('Vui lòng nhập tên hiển thị.', 'error');

    btn.disabled = true;
    btn.textContent = 'Đang xử lý...';

    if (currentTab === 'login') {
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) {
        showMsg('Email hoặc mật khẩu không đúng.', 'error');
      } else {
        await showLoggedIn(data.user);
      }
    } else {
      const { data, error } = await db.auth.signUp({ email, password });
      if (error) {
        showMsg('Đăng ký thất bại: ' + error.message, 'error');
      } else {
        if (data.user) {
          await db.from('profiles').upsert({
            id: data.user.id,
            username: username,
            role: 'user'
          });
        }
        showMsg('Đăng ký thành công! Hãy đăng nhập ngay.', 'success');
        switchTab('login');
      }
    }

    btn.disabled = false;
    btn.textContent = currentTab === 'login' ? 'Đăng nhập' : 'Đăng ký';
  }

  async function showLoggedIn(user) {
    const { data: profile } = await db.from('profiles')
      .select('username, role')
      .eq('id', user.id)
      .single();

    const username = profile?.username || user.email.split('@')[0];
    const role     = profile?.role || 'user';

    document.getElementById('auth-form').style.display = 'none';
    document.getElementById('logged-in').style.display = 'block';
    document.getElementById('user-name').textContent   = 'Xin chào, ' + username + '!';
    document.getElementById('user-avatar').textContent = username.charAt(0).toUpperCase();

    const roleEl = document.getElementById('user-role');
    if (role === 'admin') {
      roleEl.textContent = '⚙️ Quản trị viên';
      roleEl.className   = 'user-role admin';
      document.getElementById('admin-btn').style.display = 'block';
    } else {
      roleEl.textContent = '✦ Thành viên';
      roleEl.className   = 'user-role user';
    }
  }

  async function handleLogout() {
    await db.auth.signOut();
    location.reload();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleAuth();
  });
</script>

</body>
</html>
